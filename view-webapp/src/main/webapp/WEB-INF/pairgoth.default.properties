# environment
env = dev

# webapp connector
webapp.protocol = http
webapp.interface = localhost
webapp.port = 8080
webapp.context = /
webapp.external.url = http://localhost:8080

# api connector
api.protocol = http
api.interface = localhost
api.port = 8085
api.context = /api
api.external.url = http://localhost:8085/api

# webhook (optional); when set, /health is checked at startup
webhook.url =
webhook.secret =

# store
store = file
store.file.path = tournamentfiles

auth = none
# external auth: the fronting site login page (mandatory in external mode); sessionless requests
# are redirected there with the original target appended as the goto parameter
#auth.external.login_url =
# external auth: the secret shared with the fronting site, encrypting the SSO tickets
# (>= 16 ascii chars; distinct from auth.shared_secret, which never leaves pairgoth)
#auth.external.secret =

# smtp
smtp.sender = 
smtp.host = 
smtp.port = 587
smtp.user = 
smtp.password = 

# logging
logger.level = trace
logger.format = [%level] %ip [%logger] %message
